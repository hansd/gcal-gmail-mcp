name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          DATE=$(date -u +%Y.%m.%d)
          SHA=$(git rev-parse --short HEAD)
          COUNT=$(git rev-list --count HEAD --since="$(date -u +%Y-%m-%dT00:00:00Z)")
          VERSION="${DATE}.${COUNT}-${SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build JAR
        run: ./gradlew jar
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}

      - name: Build macOS installer
        run: |
          VERSION=${{ steps.version.outputs.version }}

          # Create staging directory with the JAR
          mkdir -p staging
          cp build/libs/gcal-gmail-mcp.jar staging/

          # Build the .pkg
          pkgbuild \
            --root staging \
            --identifier com.hansdockter.gcal-gmail-mcp \
            --version "$VERSION" \
            --install-location /tmp/gcal-gmail-mcp-staging \
            --scripts packaging/scripts \
            "build/gcal-gmail-mcp-${VERSION}.pkg"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: |
            build/libs/gcal-gmail-mcp.jar
            build/gcal-gmail-mcp-*.pkg
          generate_release_notes: true
          make_latest: true
